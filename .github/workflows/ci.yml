name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR; let pushes to `main` finish so the
# branch protection signal is always based on the latest tip.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # typescript-eslint's type-aware rules resolve workspace imports
      # through each package's emitted `.d.ts` files (composite project
      # references). Without a build, the integration tests under
      # `apps/cli/test/integration/**` see `@toolbox/*` as `any`, which
      # makes `no-unsafe-*` fire. `pnpm typecheck` happens to work without
      # this step because it runs through Turbo (`dependsOn: ["^build"]`).
      - run: pnpm build
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:run

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:integration
