name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs share a per-branch group so a force-push or new commit cancels
# the in-flight run for the same PR. Push runs to `main` are keyed by SHA
# so every commit gets its own lane — runs neither cancel nor queue each
# other, and the post-merge regression signal lands on every commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # typescript-eslint's type-aware rules resolve workspace imports
      # through each package's emitted `.d.ts` files (composite project
      # references). Without a build, the integration tests under
      # `apps/cli/test/integration/**` see `@toolbx/*` as `any`, which
      # makes `no-unsafe-*` fire. `pnpm typecheck` happens to work without
      # this step because it runs through Turbo (`dependsOn: ["^build"]`).
      - run: pnpm build
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:run

  token-leak-check:
    name: Token-leak check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Capture runtime logs
        shell: bash
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee runtime-token-leak-check.log
      - run: node scripts/check-no-token-leaks.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `pnpm coverage` runs `vitest run --coverage` directly (no Turbo), so
      # the CLI tests need workspace `dist/` output to resolve `@toolbx/*`.
      - run: pnpm build
      - run: pnpm coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:integration
