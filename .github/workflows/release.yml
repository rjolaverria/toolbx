name: Release

# Publishes all four @toolbox/* packages to npm when a vX.Y.Z tag is pushed.
# The first release (0.1.0) is published manually (see RELEASING.md); this
# workflow handles every tagged release after that.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      # Installs pnpm + Node (.nvmrc) + workspace deps (frozen lockfile).
      - uses: ./.github/actions/setup

      # Re-point Node at the public registry so NODE_AUTH_TOKEN authenticates
      # the publish. (The composite setup above does not set registry-url.)
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm build
      - run: pnpm test:run
      - run: pnpm test:integration

      # pnpm walks the workspace in dependency order and rewrites the internal
      # workspace:^ refs to real version ranges. --provenance attaches the npm
      # supply-chain attestation (requires id-token: write above).
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
