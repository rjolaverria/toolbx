name: Release

# Publishes all four @toolbx/* packages to npm when a GitHub Release is
# published. Tokenless via OIDC "trusted publishing" — no NPM_TOKEN secret. Each
# package must have a trusted publisher configured on npmjs.com pointing at this
# repository and this workflow file (see RELEASING.md). Creating the GitHub
# Release is the single trigger: tag, publish, and provenance all follow from it.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance attestation

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs pnpm (10.x — OIDC trusted publishing works on 10, broke on
      # 11.0.8) + Node (.nvmrc; >= 22.14 required for OIDC) + workspace deps.
      # Deliberately no registry-url / NODE_AUTH_TOKEN: OIDC needs no token line.
      - uses: ./.github/actions/setup

      - run: pnpm build
      - run: pnpm test:run
      - run: pnpm test:integration

      # pnpm walks the workspace in dependency order and rewrites the internal
      # workspace:^ refs to real version ranges. Under OIDC it exchanges the
      # GitHub id-token for a short-lived npm credential automatically (no
      # secret); --provenance attaches the supply-chain attestation.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
