name: Release

# Changesets-driven release. On every push to main:
#   - with pending changesets: open/update the "Version Packages" PR, which bumps
#     all four @toolbx/* packages in lockstep and writes their CHANGELOGs;
#   - after that PR merges (no pending changesets): build, publish to npm, and
#     create a GitHub Release per package tag.
# Publishing is tokenless via npm OIDC "trusted publishing" — there is no
# NPM_TOKEN. Each package must have this repository + this workflow registered as
# a trusted publisher on npmjs.com (see RELEASING.md). Provenance is automatic.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the Version Packages branch, create tags + GitHub Releases
  pull-requests: write # open/update the Version Packages PR
  id-token: write # OIDC trusted publishing + provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Changesets needs full history to compute releases

      # pnpm 10.x (OIDC works on 10, regressed on 11.0.8) + Node (.nvmrc; >= 22.14
      # for OIDC) + deps. Deliberately no registry-url: an empty _authToken line
      # would make npm think auth is configured and skip the OIDC token exchange.
      - uses: ./.github/actions/setup

      - name: Create Version Packages PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm release
          title: 'release: version packages'
          commit: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
