name: Setup
description: >
  Shared CI setup — installs pnpm (version from the root `packageManager`
  field), sets up Node (version from `.nvmrc`) with pnpm-store caching keyed
  on `pnpm-lock.yaml`, and installs workspace dependencies with a frozen
  lockfile.

inputs:
  ignore-scripts:
    description: >
      Install without running dependency lifecycle scripts. Set by the
      privileged publish job so third-party install hooks never execute in a
      context that can mint an npm OIDC publishing credential.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
